transactionType":"rent","productLabel":{"productLabelText":null,"spotlightLabel":false},"commercial":false,"development":false,"residential":true,"students":false,"auction":false,"feesApply":true,"feesApplyText":"\u003cp\u003eAssured Periodic Tenancy (APT)\u003c/p\u003e\u003cp\u003eA holding deposit of one week s rent to reserve a property and will then contribute towards the first month's rent.\u003c/p\u003e\u003cp\u003eThe security deposit, equivalent to five weeks rent, rising to six weeks rent when the annual rent is in excess of £50,000.\u003c/p\u003e\u003cp\u003eThe rent and utility bills as outlined in the Tenancy Agreement.\u003c/p\u003e\u003cp\u003eUnpaid rent will potentially incur interest at 3% above the Bank of England base rate, as outlined in the Tenancy Agreement.\u003c/p\u003e\u003cp\u003eTenants are liable for the cost of replacing any lost keys or security device, including a change of lock or replacement of device if required.\u003c/p\u003e\u003cp\u003eAmendments of Tenancy Agreement at the tenant s request is a minimum of £50 per change which could increase depending on the level of work required to carry out the amendment.\u003c/p\u003e\u003cp\u003eShould a tenant need to surrender the tenancy early and the Landlord agrees to re-let the property, the liability for the payment of rent will end once a new tenant is found and takes up occupation, or once a valid notice has expired. However, the tenant will still need to cover the Landlord s costs for re-letting the property if they vacate prior to the expiration of the notice.\u003c/p\u003e\u003cp\u003eTenancies that are not an Assured Periodic Tenancy \u003c/p\u003e\u003cp\u003eIn addition to the above, the below will be applicable: \u003c/p\u003e\u003cp\u003eA one-off upfront payment of £180 per tenancy which is a contribution towards processing the application, drawing up the Tenancy Agreement and registering the deposit.\u003c/p\u003e\u003cp\u003eTenant reference charge (£60 per tenant) covers it - In England under the Tenant Fees Act 2019 Deposits are limited to the equivalent of 5 weeks rent for new and renewed tenancies (or 6 weeks if the annual rent is £50,000 or more). This is calculated by dividing the annual rent by 52 and multiplying by 5 (or 6 if rent is £50,000 or more) and will be required to be paid at the start of the tenancy. This is subject to referencing.\u003c/p\u003e\u003cp\u003eHolding deposit - In England under the Tenant Fees Act 2019 Holding Deposits are limited to the equivalent of one weeks rent. This is paid in order to reserve a property. This is calculated by multiplying the monthly rent by 12 to establish the annual rent, then dividing the annual rent by 52. The Holding Deposit will be required to be paid once your offer is accepted. You will be provided with the rules of when this is to be returned to you or retained by the agent before this payment is made.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTenant Fees Act 2019\u003c/strong\u003e permits certain fees / charges to be made under the following circumstances:\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eFee\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003e£ Inc. VAT\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eExplanation\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCompany application fee\u003c/td\u003e\u003ctd\u003e£100.00 \u003c/td\u003e\u003ctd\u003e£100 including VAT\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDefault fee for late payment of rent\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003eChargeable from 14 days arrears calculated on the interest at 3% above Bank of England base rate on the late payment of rent for each day that the payment is outstanding.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLoss of a key or other security device\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003eLandlords and letti
