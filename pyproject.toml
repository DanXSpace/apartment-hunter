[project]
name = "apartment-hunter"
version = "0.2.0"
description = "Watches apartments.com searches and sends Discord alerts for new listings and price drops"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]>=0.5.1",
    "playwright>=1.58.0",
    "python-dotenv",
    "requests",
]

[project.scripts]
apartment-hunter = "apartment_hunter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apartment_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
