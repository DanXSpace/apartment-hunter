[project]
name = "apartment-hunter"
version = "0.2.0"
description = "A Discord bot that posts new rental listings from Zillow and Craigslist"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "curl-cffi>=0.16.3",
    "scrapling>=0.5.1",
    "discord-py>=2.7.1",
]

[project.scripts]
apartment-hunter = "apartment_hunter.bot.main:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apartment_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests are offline (see CODING_STANDARDS.md): a connection to anything but loopback fails at once
# instead of hanging. Loopback stays open for asyncio's self-pipe (a TCP socketpair on Windows).
addopts = "--disable-socket --allow-hosts=127.0.0.1"
timeout = 10

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SLF001", "TID251"]

[tool.ruff.lint.per-file-ignores]
# Private-access and banned-import rules guard the tests only (see CODING_STANDARDS.md)
"!tests/**" = ["SLF001", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Tests use hand-written fakes (see CODING_STANDARDS.md), not a mocking library."
"pytest_mock".msg = "Tests use hand-written fakes (see CODING_STANDARDS.md), not a mocking library."
"playwright".msg = "No browser anywhere: the bot uses plain HTTP, and tests use hand-written fakes."
