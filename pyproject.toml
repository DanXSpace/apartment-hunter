[project]
name = "apartment-hunter"
version = "0.2.0"
description = "Watches apartments.com searches and sends Discord alerts for new listings and price drops"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]>=0.5.1",
    "playwright>=1.58.0",
    "python-dotenv",
    "requests",
    "platformdirs>=4.14.5",
]

[project.scripts]
apartment-hunter = "apartment_hunter.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apartment_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests are offline (see CODING_STANDARDS.md): a network call fails at once instead of hanging
addopts = "--disable-socket"
timeout = 10
filterwarnings = [
    # anyio's pytest plugin (pulled in by scrapling) uses a pytest alias slated for removal
    "ignore:_pytest.python.CallSpec2 has been renamed",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SLF001", "TID251"]

[tool.ruff.lint.per-file-ignores]
# Private-access and banned-import rules guard the tests only (see CODING_STANDARDS.md)
"!tests/**" = ["SLF001", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Tests use hand-written fakes (see CODING_STANDARDS.md), not a mocking library."
"pytest_mock".msg = "Tests use hand-written fakes (see CODING_STANDARDS.md), not a mocking library."
"playwright".msg = "Tests never launch a browser; use a fake Fetcher or Scraper."
